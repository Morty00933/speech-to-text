# Nginx — reverse proxy + static frontend server
# Serves the HTML/CSS/JS SPA and proxies /api/* to FastAPI.
# No Streamlit, no WebSocket, no caching headaches.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Allow large audio file uploads (up to 500 MB)
    client_max_body_size 500M;

    server {
        listen 80;

        # Disable browser caching for all responses (HTML, JS, API)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        # ----------------------------------------------------------------
        # Static frontend SPA
        # ----------------------------------------------------------------
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            # SPA fallback — all unknown paths serve index.html
            try_files $uri $uri/ /index.html;
        }

        # ----------------------------------------------------------------
        # Proxy /api/* → FastAPI container (strips the /api prefix)
        # ----------------------------------------------------------------
        location /api/ {
            proxy_pass http://api:8000/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No proxy-side caching
            proxy_no_cache    1;
            proxy_cache_bypass 1;

            # Large timeouts: file uploads can take time, transcription too
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Stream uploads without nginx buffering (important for large files)
            proxy_request_buffering off;

            # Increase response buffer for large JSON results
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
