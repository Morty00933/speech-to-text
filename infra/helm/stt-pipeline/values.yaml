# =============================================================================
# Global
# =============================================================================
global:
  imageRegistry: ""
  imagePullSecrets: []

# =============================================================================
# API (FastAPI)
# =============================================================================
api:
  replicaCount: 1
  image:
    repository: speech-to-text-pipeline-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  env:
    rateLimit: "100/minute"
    logLevel: "INFO"
    logFormat: "json"

# =============================================================================
# Worker (Celery + Whisper)
# =============================================================================
worker:
  replicaCount: 1
  image:
    repository: speech-to-text-pipeline-worker
    tag: latest
    pullPolicy: IfNotPresent
  concurrency: 1
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 10Gi
  env:
    defaultModelSize: "tiny"
    cudaVisibleDevices: "0"
    logLevel: "INFO"
    logFormat: "json"
  modelVolume:
    mountPath: /models

# =============================================================================
# Frontend (Streamlit)
# =============================================================================
frontend:
  replicaCount: 1
  image:
    repository: speech-to-text-pipeline-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8501
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# =============================================================================
# PostgreSQL
# =============================================================================
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - $(POSTGRES_USER)
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - $(POSTGRES_USER)
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  persistence:
    size: 5Gi
    storageClass: ""

# =============================================================================
# Redis
# =============================================================================
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  args:
    - redis-server
    - --appendonly
    - "yes"
    - --maxmemory
    - 256mb
    - --maxmemory-policy
    - allkeys-lru
  livenessProbe:
    exec:
      command:
        - redis-cli
        - ping
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    exec:
      command:
        - redis-cli
        - ping
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  persistence:
    size: 2Gi
    storageClass: ""

# =============================================================================
# MinIO (Object Storage)
# =============================================================================
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /minio/health/live
      port: api
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /minio/health/ready
      port: api
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  bucket: stt-audio
  persistence:
    size: 10Gi
    storageClass: ""

# =============================================================================
# Persistence - models volume
# =============================================================================
models:
  persistence:
    size: 20Gi
    storageClass: ""

# =============================================================================
# Secrets (override with --set or external secret manager)
# =============================================================================
secrets:
  postgres:
    user: stt
    password: CHANGEME
    db: stt
  minio:
    accessKey: CHANGEME
    secretKey: CHANGEME
  api:
    apiKey: CHANGEME
  worker:
    hfToken: ""

# -- External infrastructure hosts (for hybrid mode)
infra:
  external: false
  postgresHost: ""
  redisHost: ""
  minioHost: ""
