[project]
name = "speech-to-text-pipeline"
version = "1.0.0"
description = "Production-ready Speech-to-Text Pipeline with Faster Whisper"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

authors = [
    {name = "Developer", email = "dev@example.com"}
]

keywords = ["speech-to-text", "whisper", "transcription", "diarization"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "celery>=5.3.0,<6.0",
    "redis>=5.0.0,<6.0",

    # Transcription
    "faster-whisper>=1.1.0,<2.0",

    # Audio
    "librosa>=0.10.0,<1.0",
    "soundfile>=0.12.0,<1.0",
    "numpy>=1.24.0",

    # VAD
    "onnxruntime>=1.17.0,<2.0",

    # Punctuation
    "deepmultilingualpunctuation>=1.0.0,<2.0",

    # Database
    "sqlalchemy>=2.0.0,<3.0",
    "psycopg2-binary>=2.9.0,<3.0",

    # Storage
    "minio>=7.2.0,<8.0",

    # Config
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",

    # Metrics
    "prometheus-client>=0.19.0,<1.0",

    # Utils
    "tenacity>=8.2.0,<9.0",
    "httpx>=0.26.0,<1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0,<1.0",
    "uvicorn[standard]>=0.27.0,<1.0",
    "python-multipart>=0.0.6,<1.0",
    "slowapi>=0.1.9,<1.0",
    # JWT authentication
    "python-jose[cryptography]>=3.3.0,<4.0",
    # WebSocket support (async redis pub/sub)
    "websockets>=12.0,<14.0",
]

frontend = [
    "streamlit>=1.31.0,<2.0",
    "requests>=2.31.0,<3.0",
]

gpu = [
    "torch>=2.5.0,<3.0",
    "torchaudio>=2.5.0,<3.0",
]

diarization = [
    "pyannote.audio>=3.1.0,<4.0",
]

dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=4.1.0,<5.0",
    "black>=24.0.0,<25.0",
    "ruff>=0.2.0,<1.0",
    "mypy>=1.8.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.hatch.build.targets.sdist]
include = [
    "services/",
    "pyproject.toml",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
